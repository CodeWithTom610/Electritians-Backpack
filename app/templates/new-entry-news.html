{% from 'bootstrap5/form.html' import render_form %}
{% block content %}

<!-- Head Section with Meta Information and External Scripts -->
<head>
  <!-- Character encoding and viewport settings for responsive design -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- External scripts for Bootstrap and Popper.js (required for Bootstrap functionality) -->
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" 
          integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" 
          crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js" 
          integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy" 
          crossorigin="anonymous"></script>

  <!-- Load Bootstrap CSS dynamically -->
  {{ bootstrap.load_css() }}

  <!-- Title of the page, set dynamically from the 'title' variable -->
  <title>{{title}}</title>
</head>    

<!-- Body Section -->
<body class="bg-light">
    <main class="d-flex">
        <!-- Sidebar Section -->
        <div class="d-flex flex-column flex-shrink-0 p-3 text-white bg-dark" style="width: 280px; height: 100vh;">
            <!-- Sidebar Header with Username -->
            <a href="/" class="d-flex align-items-center mb-3 mb-md-0 me-md-auto text-white text-decoration-none">
                <span class="fs-4">Moin, {{username}}</span> <!-- Display the username dynamically -->
            </a>
            <hr>
            
            <!-- Sidebar Navigation Links -->
            <ul class="nav nav-pills flex-column mb-auto">
                <!-- Dashboard Link -->
                <li class="nav-item">
                    <a href="{{url_for('main.admin_dashboard')}}" class="nav-link active" aria-current="page">
                        <i class="bi bi-house-door-fill me-2"></i> Dashboard <!-- Icon and text for the dashboard -->
                    </a>
                </li>
                <!-- Users Link -->
                <li>
                    <a href="{{url_for('main.users')}}" class="nav-link text-white">
                        <i class="bi bi-people-fill me-2"></i> Benutzer <!-- Icon and text for managing users -->
                    </a>
                </li>
                <!-- Manage News Link -->
                <li>
                    <a href="{{url_for('main.manage_news')}}" class="nav-link text-white">
                        <i class="bi bi-pencil-fill me-2"></i> Neuigkeiten Bearbeiten <!-- Icon and text for managing news -->
                    </a>
                </li>
            </ul>
            <hr>

            <!-- User Profile Dropdown -->
            <div class="dropdown">
                <a href="{{url_for('main.admin_dashboard')}}" class="d-flex align-items-center text-white text-decoration-none dropdown-toggle" 
                   id="dropdownUser1" data-bs-toggle="dropdown" aria-expanded="false">
                    <strong>{{username}}</strong> <!-- Display username in the dropdown -->
                </a>
                <ul class="dropdown-menu dropdown-menu-dark text-small shadow" aria-labelledby="dropdownUser1">
                    <!-- Logout option in the dropdown -->
                    <li><a class="dropdown-item" href="{{url_for('main.admin_logout')}}">Ausloggen</a></li>
                </ul>
            </div>
        </div>

        <!-- Main Content Area -->
        <div class="flex-grow-1 p-4">
            <!-- Top Navigation with Page Title -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2>{{title}}</h2> <!-- Dynamic page title -->
            </div>

            <!-- Content Section for Form Rendering -->
            <div class="container-sm" style="align-items: center; padding: 60px; background-color: rgb(191, 191, 191); 
                                           margin-top: 60px; border-radius: 30px;">
                <!-- Render the form using Flask-WTF render_form helper -->
                {{render_form(form)}}

                <!-- Cancel Button to go back to the 'manage_news' page -->
                <a class="btn btn-danger" href="{{url_for('main.manage_news')}}" role="button">Abbrechen</a>
            </div>
            
        </div>
    </main>
</body>

{% endblock content %}
