{% from 'bootstrap5/form.html' import render_form %}
<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/x-icon" href="../static/development-tool.ico">
    <!-- Character encoding set to UTF-8 for proper text rendering -->
    <meta charset="UTF-8">
    <!-- Ensures responsive design for mobile devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Bootstrap's Popper.js library for handling positioning of dropdowns and tooltips -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    
    <!-- Bootstrap's main JavaScript file for handling interactive elements like dropdowns -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js" integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy" crossorigin="anonymous"></script>
    
    <!-- Load Bootstrap's CSS dynamically via Flask's `bootstrap` object -->
    {{ bootstrap.load_css() }}
    
    <!-- Dynamically set the page title from the `title` variable -->
    <title>{{title}}</title>
</head>

<body style="background-color: #d7dada; color: #201a1e;">  <!-- Set background color and text color for the page -->
    
    <!-- Main Navbar -->
    <nav class="navbar navbar-expand-lg" style="background-color: #d0b49f; z-index: 9;">  <!-- Set navbar background color -->
        <div class="container-fluid">
            <!-- Branding of the application with a clickable logo (EBT-Backpack) -->
            <a class="navbar-brand" href="#">🎒 EBT-Backpack</a>
            
            <!-- Hamburger menu for collapsing the navbar on smaller screens -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <!-- Navbar links that collapse into a dropdown on smaller screens -->
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <!-- Link to the news page -->
                    <li class="nav-item">
                        <a class="nav-link" href="{{url_for('main.news')}}">News</a>
                    </li>
                    
                    <!-- Link to the tools page -->
                    <li class="nav-item">
                        <a class="nav-link" href="{{url_for('main.tools_complete')}}">Alle Tools</a>
                    </li>
                    
                    <!-- Link to the admin login page -->
                    <li class="nav-item">
                        <a class="nav-link" href="{{url_for('main.admin_login')}}">Admin Login</a>
                    </li>
                    
                    <!-- Link to the knowledgebase page -->
                    <li class="nav-item">
                        <a class="nav-link" href="{{url_for('main.knowledgebase')}}">Knowledgebase</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Content Section where page-specific content will be rendered -->
    {% block content %}
    <!-- Content will be inserted here from the child template -->
    {% endblock content %}

</body>
</html>
