{% block content %}
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js" integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy" crossorigin="anonymous"></script>
  {{ bootstrap.load_css() }}
  <title>{{title}}</title>
</head>    

<body class="bg-light">

    <main class="d-flex">
        <!-- Sidebar -->
        <div class="d-flex flex-column flex-shrink-0 p-3 text-white bg-dark" style="width: 280px; height: 100vh;">
            <a href="/" class="d-flex align-items-center mb-3 mb-md-0 me-md-auto text-white text-decoration-none">
                <span class="fs-4">Moin, {{username}}</span>
            </a>
            <hr>
            <ul class="nav nav-pills flex-column mb-auto">
                <li class="nav-item">
                    <a href="{{url_for('main.admin_dashboard')}}" class="nav-link text-white" aria-current="page">
                        <i class="bi bi-house-door-fill me-2"></i> Dashboard
                    </a>
                </li>
                <li>
                    <a href="{{url_for('main.users')}}" class="nav-link text-white">
                        <i class="bi bi-people-fill me-2"></i> Benutzer
                    </a>
                </li>
                <li>
                    <a href="{{url_for('main.manage_news')}}" class="nav-link active">
                        <i class="bi bi-pencil-fill me-2"></i> Neuigkeiten bearbeiten
                    </a>
                </li>
            </ul>
            <hr>
            <div class="dropdown">
                <a href="{{url_for('main.admin_dashboard')}}" class="d-flex align-items-center text-white text-decoration-none dropdown-toggle" id="dropdownUser1" data-bs-toggle="dropdown" aria-expanded="false">
                    <strong>{{username}}</strong>
                </a>
                <ul class="dropdown-menu dropdown-menu-dark text-small shadow" aria-labelledby="dropdownUser1">
                    <li><a class="dropdown-item" href="{{url_for('main.admin_logout')}}">Ausloggen</a></li>
                </ul>
            </div>
        </div>

        <!-- Main Content Area -->
        <div class="flex-grow-1 p-4">
            <!-- Top Navigation or Breadcrumb -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2>{{title}}</h2>
                <a class="btn btn-primary" href="{{url_for('main.new_entry')}}" role="button">Neuer Eintrag</a>
            </div>
            <div class="col">
                <div class="row" style="gap: 15px; padding-left:30px; padding-right:30px;">
                    
                    {% for new in news %}
                    <div class="card" style="width: 18rem;">
                        <div class="card-body">
                          <h5 class="card-title">{{new.header}}</h5>
                          <p class="card-text">{{new.content}}</p>
                          <a href="{{url_for('main.edit_news', news_id=new.id)}}" class="btn btn-primary">Bearbeiten</a>
                          <a href="{{ url_for('main.delete_card', id=new.id) }}" class="btn btn-danger">Löschen</a>
                        </div>
                    </div>
                    {% endfor %}
                </div>
            </div>
        </div>
    </main>
</body>
{% endblock content %}
