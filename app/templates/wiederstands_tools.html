{% extends 'base.html' %}

{% block content %}

<div class="container mt-5">
    <div class="row justify-content-center">  <!-- Zentriert die Karten -->
        {% for tool in tools %}
        <div class="col-lg-4 col-md-6 col-sm-12 d-flex align-items-stretch mb-4">  <!-- Dynamische Spalten -->
            <div class="card shadow-sm" style="width: 100%;">
                <div class="card-body d-flex flex-column">
                    <h5 class="card-title">{{tool.tool_name}}</h5>
                    <p class="card-text">{{tool.tool_description}}</p>
                    <a class="btn btn-primary" role="button" href="{{url_for('main.' + tool.endpoint)}}">Zum Tool</a>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>

{% endblock content %}
