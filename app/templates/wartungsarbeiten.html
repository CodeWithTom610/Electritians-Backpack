<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maintenance in Progress</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(to bottom, #f8f9fa, #e9ecef);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Arial', sans-serif;
        }
        .maintenance-container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        .maintenance-icon {
            font-size: 5rem;
            color: #6c757d;
        }
        .maintenance-heading {
            font-size: 2rem;
            margin: 20px 0;
            color: #343a40;
        }
        .maintenance-text {
            font-size: 1.2rem;
            color: #6c757d;
        }
        .btn-primary {
            margin-top: 20px;
            background-color: #0d6efd;
            border-color: #0d6efd;
            font-size: 1rem;
            padding: 10px 20px;
            border-radius: 50px;
            transition: all 0.3s;
        }
        .btn-primary:hover {
            background-color: #0b5ed7;
            border-color: #0b5ed7;
        }
        .footer {
            margin-top: 30px;
            font-size: 0.9rem;
            color: #adb5bd;
        }
        .password-form {
            margin-top: 30px;
            text-align: left;
        }
        .password-form input {
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="maintenance-container">
        <div class="maintenance-icon">
            <img src="../static/work-in-progress.png" alt="Work in Progress Logo designed by umeicon from Flaticon">
        </div>
        <h1 class="maintenance-heading">Wartungsarbeiten<br>Bald wieder verfügbar</h1>
        <p class="maintenance-text">Die Seite erstrahlt bald in neuem Glanz</p>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free/js/all.min.js"></script>
</body>
</html>
