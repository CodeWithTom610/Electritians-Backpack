{% from 'bootstrap5/form.html' import render_form %}
{% block content %}
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js" integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy" crossorigin="anonymous"></script>
  {{ bootstrap.load_css() }}
  <title>{{title}}</title>
</head>    

<body class="bg-light">

        <!-- Main Content Area -->
        <div class="flex-grow-1 p-4">
            <!-- Top Navigation or Breadcrumb -->
            <div class="d-flex" style="width: auto;">
                <h2 style="align-self: center;">{{title}}</h2>
            </div>

            <div class="container-sm", style="align-items: center; padding: 60px; background-color: rgb(191, 191, 191); margin-top: 60px; border-radius: 30px;">
                {{render_form(form)}}
                <a class="btn btn-danger" href="{{url_for('main.users')}}" role="button">Abbrechen</a>
            </div>
            
        </div>
    </main>
</body>
{% endblock content %}
