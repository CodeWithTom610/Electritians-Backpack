{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">  <!-- Zentriert die Karten -->
        {% for new in news %}
        <div class="col-lg-4 col-md-6 col-sm-12 d-flex align-items-stretch mb-4">  <!-- Dynamische Spalten -->
            <div class="card shadow-sm" style="width: 100%;">
                <img src="/static/IMG/{{new.imagepath}}" class="card-img-top" alt="{{new.header}}" style="height: 233px; width: 414px; ">
                <div class="card-body d-flex flex-column">
                    <h5 class="card-title">{{new.header}}</h5>
                    <p class="card-text">{{new.content}}</p>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock content %}
