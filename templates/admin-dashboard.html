<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
{% block content %}
    
<body>

<div class="container">
    <h1>Admin Dashboard</h1>

    <!-- Logout Form -->
    <form method="POST">
        {{ form.hidden_tag() }}
        {{ form.logoutbutton(class="btn btn-danger") }}
    </form>

    <h2>News Cards</h2>
    <div class="row">
        {% for card in news_cards %}
        <div class="col-md-4">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">{{ card.header }}</h5>
                    <p class="card-text">{{ card.content }}</p>
                    <p class="card-text"><small>By {{ card.author }}</small></p>

                    <!-- Edit Button -->
                    <a href="{{ url_for('edit_news', news_id=card.id) }}" class="btn btn-warning">Edit</a>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>

    <a href="{{ url_for('manage_news') }}" class="btn btn-primary mt-3">Add New News Card</a>
</div>

</body>
{% endblock content %}
</html>
